name: Fly Deploy
on:
  push:
    branches:
      - 'ollama'
env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
jobs:
  deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            ref: ollama
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - run: flyctl deploy
